apiVersion: apps/v1
kind: Deployment
metadata:
  name: arforge-acceptance
spec:
  replicas: 2
  selector:
    matchLabels:
      app: arforge-acceptance
  template:
    metadata:
      labels:
        app: arforge-acceptance
    spec:
      containers:
        - name: web
          image: arforge/devops-acceptance:0.1.0
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
