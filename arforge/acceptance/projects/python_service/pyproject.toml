[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arforge-acceptance-python-service"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
