[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arforge-agent"
version = "1.0.0.dev1"
description = "Local model capability enhancement agent system"
readme = "README.md"
license = "LicenseRef-Proprietary"
authors = [
    {name = "Arforge Team"}
]
keywords = ["ai", "agent", "code-agent", "cli", "deepseek", "chinese", "arforge"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Agents",
]
requires-python = ">=3.10"

dependencies = [
    "alembic>=1.13.0,<2",
    "anthropic>=0.40.0,<1",
    "cryptography>=42.0.0,<50",
    "fastapi>=0.139.2,<0.140",
    "numpy>=1.26.0,<3",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "prompt-toolkit>=3.0.48,<4",
    "rank-bm25>=0.2.2,<0.3",
    "sqlalchemy>=2.0.0",
    "starlette>=1.3.1,<2",
    "tomli>=2.0.0; python_version<'3.11'",
    "tree-sitter>=0.25.0,<0.26",
    "tree-sitter-go>=0.25.0,<0.26",
    "tree-sitter-javascript>=0.25.0,<0.26",
    "tree-sitter-rust>=0.24.0,<0.25",
    "tree-sitter-typescript>=0.23.0,<0.24",
    "uvicorn[standard]>=0.34.0,<1",
    "websockets>=15.0,<17",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.0",
    "httpx2>=2.7.0,<3",
    "pillow>=11.0.0,<13",
    "pip-audit>=2.10.0,<3",
    "pytest>=8.0.0",
    "python-docx>=1.2.0,<2",
    "ruff>=0.12.0",
    "wheel>=0.45.0,<1",
]
desktop-build = [
    "pyinstaller==6.21.0",
]
data = [
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
]
postgres = [
    "psycopg2-binary>=2.9.0",
]
migration = []

[project.scripts]
arforge = "arforge.cli:main"
arforge-bridge = "arforge.bridge:main"

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
where = ["."]
include = ["arforge*"]
exclude = [
    "arforge_corrupt_backup_*",
    "arforge_corrupt_backup_*.*",
    "arforge*.__pycache__",
    "arforge*.__pycache__.*",
]

[tool.setuptools.package-data]
arforge = ["*.py", "tools/*.py", "database/migrations/*.mako", "acceptance/*.json", "acceptance/projects/**/*", "bundled_skills/**/*"]

[tool.setuptools.exclude-package-data]
"*" = [
    "*.pyc",
    "**/*.pyc",
    "__pycache__/*",
    "**/__pycache__/*",
    "*LICENSE*",
    "*LICENCE*",
    "*COPYING*",
    "*NOTICE*",
    "upstream.json",
    "**/upstream.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
norecursedirs = [
    ".arforge",
    ".recovery_pyc",
    ".venv",
    "arforge_corrupt_backup_*",
    "memory-vault",
    "tests/legacy_script",
]

[tool.ruff]
force-exclude = true
extend-exclude = ["tests/legacy_script"]
