name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked development environment
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Install current checkout
        run: python -m pip install --no-deps -e .
      - name: Provision target-owned Bun runtime on Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p .tools/bun-1.3.14
          cp "$(command -v bun)" .tools/bun-1.3.14/bun.exe
          chmod +x .tools/bun-1.3.14/bun.exe
      - name: Provision target-owned Bun runtime and workspace on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .tools/bun-1.3.14 -Force | Out-Null
          Copy-Item -LiteralPath (Get-Command bun).Source -Destination .tools/bun-1.3.14/bun.exe -Force
          bun install --frozen-lockfile
          $electronPackage = Get-ChildItem -LiteralPath node_modules/.bun -Directory -Filter 'electron@42.3.3*' |
            Sort-Object Name |
            Select-Object -First 1
          if ($null -eq $electronPackage) {
            throw 'Electron package is unavailable after bun install.'
          }
          $electronRoot = Join-Path $electronPackage.FullName 'node_modules/electron'
          if (!(Test-Path -LiteralPath (Join-Path $electronRoot 'path.txt') -PathType Leaf)) {
            node (Join-Path $electronRoot 'install.js')
          }
          if (!(Test-Path -LiteralPath (Join-Path $electronRoot 'path.txt') -PathType Leaf)) {
            throw 'Electron binary installation did not produce path.txt.'
          }
      - name: Lint Python harness
        run: python -m ruff check arforge tests config.py main.py
      - name: Import smoke
        run: python verify_modules.py
      - name: Test Python harness
        env:
          NO_COLOR: "1"
        run: python -m pytest -q
      - name: Verify deterministic capability contracts
        run: arforge capability-eval --json
      - name: Verify installed/runtime version agreement
        run: arforge doctor --json

  typescript-quality:
    name: TypeScript lint and brand contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run brand:check

  typescript-typecheck:
    name: TypeScript typecheck (${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: typescript-quality
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: surfaces
            filters: >-
              --filter=@arforge-ai/app --filter=@arforge-ai/desktop
              --filter=@arforge-ai/session-ui --filter=@arforge-ai/storybook
              --filter=@arforge-ai/tui --filter=@arforge-ai/ui
              --filter=ghostty-web
          - shard: core
            filters: >-
              --filter=@arforge-ai/core
          - shard: product
            filters: >-
              --filter=arforge
          - shard: services
            filters: >-
              --filter=@arforge-ai/cli --filter=@arforge-ai/server
              --filter=@arforge-ai/llm
          - shard: sdk
            filters: >-
              --filter=@arforge-ai/client-next --filter=@arforge-ai/codemode
              --filter=@arforge-ai/plugin --filter=@arforge-ai/protocol
              --filter=@arforge-ai/schema --filter=@arforge-ai/sdk
              --filter=@arforge-ai/sdk-next
          - shard: infrastructure
            filters: >-
              --filter=@arforge-ai/agent-python
              --filter=@arforge-ai/effect-drizzle-sqlite
              --filter=@arforge-ai/effect-sqlite-node
              --filter=@arforge-ai/http-recorder
              --filter=@arforge-ai/httpapi-codegen
              --filter=@arforge-ai/script --filter=@arforge-ai/slack
              --filter=gitlab-ai-provider
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck -- ${{ matrix.filters }}
