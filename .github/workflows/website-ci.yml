name: Website CI

on:
  pull_request:
    paths:
      - "packages/website/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/website-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  website:
    name: Check, test, and build static website
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install locked workspace
        run: bun install --frozen-lockfile
      - name: Type and Astro diagnostics
        run: bun --cwd packages/website check
      - name: Security and release-gate tests
        run: bun --cwd packages/website test
      - name: Build static site
        run: bun --cwd packages/website build
      - name: Upload static artifact
        uses: actions/upload-artifact@v4
        with:
          name: arforge-website-${{ github.run_id }}
          path: packages/website/dist
          if-no-files-found: error
          retention-days: 14
